<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        src: url("/lib/reconstruction/fonts/inter-latin-400-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 600;
        src: url("/lib/reconstruction/fonts/inter-latin-600-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 700;
        src: url("/lib/reconstruction/fonts/inter-latin-700-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 800;
        src: url("/lib/reconstruction/fonts/inter-latin-800-normal.woff2")
          format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111414;
      }
      canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      #three {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
      }
      #error {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        font: 15px system-ui;
        color: #deb18c;
        background: #141818;
        padding: 30px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas><canvas id="three"></canvas>
    <div id="error"></div>
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.js" } }
    </script>
    <script type="module" src="/player.js"></script>
  </body>
</html>
